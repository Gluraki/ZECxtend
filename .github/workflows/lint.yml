name: Lint

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  lint-python:
    name: Ruff (api-server)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff

      - name: Run Ruff
        run: ruff check api-server

  lint-website:
    name: TypeScript + fallow (website)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: website
        run: pnpm lint

  lint-zectime:
    name: TypeScript + fallow (zectime)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: zectime/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: zectime/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: zectime
        run: pnpm install --frozen-lockfile

      - name: Run lint
        working-directory: zectime
        run: pnpm lint
