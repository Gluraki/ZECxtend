name: Build ZECtime

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: zectime/package.json

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: zectime/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zectime/src-tauri -> target

      - name: Install dependencies
        working-directory: zectime
        run: pnpm install --frozen-lockfile

      - name: Build installer
        working-directory: zectime
        run: pnpm tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: zectime-windows-${{ github.sha }}
          path: |
            zectime/src-tauri/target/release/bundle/nsis/*.exe
            zectime/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
