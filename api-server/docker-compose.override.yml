services:
  competition-service:
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - public

  auth-service:
    ports:
      - "127.0.0.1:8002:8002"
    networks:
      - public

  pgweb:
    image: sosedoff/pgweb
    container_name: pgweb
    restart: unless-stopped
    ports:
      - "8080:8081"
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      - public
      - internal
