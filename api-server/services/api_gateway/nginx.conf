env CORS_ALLOWED_ORIGINS;
env JWT_SECRET_KEY;

events {}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    limit_req_zone $binary_remote_addr zone=login:10m rate=30r/m;
    limit_req_status 429;

    lua_package_path "/etc/nginx/lua/?.lua;;";

    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;

    init_by_lua_block {
        local raw = os.getenv("CORS_ALLOWED_ORIGINS")

        if not raw or raw == "" then
            raw = "http://localhost:3000,http://127.0.0.1:3000"
        end

        local allowed = {}

        for origin in raw:gmatch("[^,%s]+") do
            allowed[origin:lower()] = true
        end

        package.loaded.cors = { allowed = allowed }

        require("auth")
    }

    map $cors_origin $cors_credentials {
        default "";
        "~." "true";
    }

    server {
        listen 80;
        client_max_body_size 100M;

        set $competition_service competition-service:8001;
        set $auth_service auth-service:8002;
        set $auth_user_id "";
        set $auth_username "";
        set $auth_role "";
        set $auth_team_id "";

        proxy_set_header X-User-Id $auth_user_id;
        proxy_set_header X-Username $auth_username;
        proxy_set_header X-Role $auth_role;
        proxy_set_header X-Team-Id $auth_team_id;
        proxy_set_header Authorization "";

        set_by_lua_block $cors_origin {
            local origin = ngx.var.http_origin

            if origin and package.loaded.cors.allowed[origin:lower()] then
                return origin
            end

            return ""
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Disposition, Content-Length" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /login {
            limit_req zone=login burst=20 nodelay;
            proxy_pass http://$auth_service$request_uri;
        }

        location = /refresh {
            proxy_pass http://$auth_service$request_uri;
        }

        location = /logout {
            proxy_pass http://$auth_service$request_uri;
        }

        location /leaderboard {
            proxy_pass http://$competition_service$request_uri;
        }

        location /challenges {
            access_by_lua_block {
                require("auth").enforce({
                    anonymous_methods = { GET = true, HEAD = true },
                    write_roles = { "ADMIN", "TEAMLEAD" },
                })
            }

            proxy_pass http://$competition_service$request_uri;
        }

        location /attempts {
            access_by_lua_block {
                require("auth").enforce({ write_roles = { "ADMIN", "TEAMLEAD" } })
            }

            proxy_pass http://$competition_service$request_uri;
        }

        location /penalties {
            access_by_lua_block {
                require("auth").enforce({ write_roles = { "ADMIN", "TEAMLEAD" } })
            }

            proxy_pass http://$competition_service$request_uri;
        }

        location /scores {
            access_by_lua_block {
                require("auth").enforce({ write_roles = { "ADMIN", "TEAMLEAD" } })
            }

            proxy_pass http://$competition_service$request_uri;
        }

        location /drivers {
            access_by_lua_block {
                require("auth").enforce({ write_roles = { "ADMIN", "TEAMLEAD" } })
            }

            proxy_pass http://$competition_service$request_uri;
        }

        location /teams {
            access_by_lua_block {
                require("auth").enforce({ write_roles = { "ADMIN", "TEAMLEAD" } })
            }

            proxy_pass http://$competition_service$request_uri;
        }

        location /export {
            access_by_lua_block {
                require("auth").enforce({ write_roles = { "ADMIN", "TEAMLEAD" } })
            }

            proxy_pass http://$competition_service$request_uri;
        }

        location /users {
            access_by_lua_block {
                require("auth").enforce({
                    read_roles = { "ADMIN" },
                    write_roles = { "ADMIN" },
                })
            }

            proxy_pass http://$auth_service$request_uri;
        }
    }
}
