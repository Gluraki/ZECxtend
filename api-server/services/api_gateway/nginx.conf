env CORS_ALLOWED_ORIGINS;

events {}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;

    lua_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    lua_ssl_verify_depth 5;

    init_by_lua_block {
        local raw = os.getenv("CORS_ALLOWED_ORIGINS")

        if not raw or raw == "" then
            raw = "http://localhost:3000,http://127.0.0.1:3000,"
        end

        local allowed = {}

        for origin in raw:gmatch("[^,%s]+") do
            allowed[origin:lower()] = true
        end

        package.loaded.cors = { allowed = allowed }
    }

    map $cors_origin $cors_credentials {
        default "";
        "~." "true";
    }

    server {
        listen 80;
        client_max_body_size 100M;

        set $competition_service competition-service:8001;
        set $auth_service auth-service:8002;

        set_by_lua_block $cors_origin {
            local origin = ngx.var.http_origin

            if origin and package.loaded.cors.allowed[origin:lower()] then
                return origin
            end

            return ""
        }

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials $cors_credentials always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept" always;
        add_header Access-Control-Expose-Headers "Content-Disposition, Content-Length" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /login {
            proxy_pass http://$auth_service$request_uri;
        }

        location = /refresh {
            proxy_pass http://$auth_service$request_uri;
        }

        location /test {
            access_by_lua_file /etc/nginx/lua/auth.lua;

            if ($http_x_role != "admin") {
                return 403;
            }

            proxy_pass http://$competition_service/api/users;
        }

        location /challenges {
            access_by_lua_file /etc/nginx/lua/auth.lua;

            proxy_pass http://$competition_service$request_uri;
        }

        location /attempts {
            proxy_pass http://$competition_service$request_uri;
        }

        location /leaderboard {
            proxy_pass http://$competition_service$request_uri;
        }

        location /penalties {
            proxy_pass http://$competition_service$request_uri;
        }

        location /scores {
            proxy_pass http://$competition_service$request_uri;
        }

        location /export {
            proxy_pass http://$competition_service$request_uri;
        }

        location /drivers {
            proxy_pass http://$competition_service$request_uri;
        }

        location /teams {
            proxy_pass http://$competition_service$request_uri;
        }

        location /users {
            proxy_pass http://$auth_service$request_uri;
        }
    }
}
