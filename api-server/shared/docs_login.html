<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title &middot; Docs Login</title>
<style>
  :root {
    color-scheme: light;
    --radius: 0.625rem;
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.145 0 0);
    --primary: oklch(0.205 0 0);
    --primary-foreground: oklch(0.985 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --destructive: oklch(0.577 0.245 27.325);
    --border: oklch(0.922 0 0);
    --input: oklch(0.922 0 0);
    --ring: oklch(0.708 0 0);
  }
  * { box-sizing: border-box; border-color: var(--border); }
  [hidden] { display: none !important; }
  body {
    margin: 0; min-height: 100svh; padding: 1.5rem;
    display: flex; align-items: center; justify-content: center;
    background: var(--background); color: var(--foreground);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%; max-width: 24rem;
    display: flex; flex-direction: column; gap: 1.5rem; padding: 1.5rem 0;
    background: var(--card); color: var(--card-foreground);
    border: 1px solid var(--border); border-radius: calc(var(--radius) + 4px);
    box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  }
  .card-header, .card-content { padding: 0 1.5rem; }
  .card-header { display: grid; gap: 0.375rem; }
  .card-title { margin: 0; font-size: 1rem; font-weight: 600; line-height: 1; }
  .card-content { display: grid; gap: 1.5rem; }

  .alert {
    padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--card); color: var(--destructive);
    font-size: 0.875rem; line-height: 1.25rem;
  }

  .field { display: grid; gap: 0.5rem; }
  label { font-size: 0.875rem; font-weight: 500; line-height: 1; user-select: none; }
  input {
    width: 100%; height: 2.25rem; padding: 0.25rem 0.75rem; min-width: 0;
    background: transparent; color: inherit; font: inherit; font-size: 0.875rem;
    border: 1px solid var(--input); border-radius: calc(var(--radius) - 2px);
    box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); outline: none;
    transition: color 150ms, box-shadow 150ms, border-color 150ms;
  }
  input:focus-visible {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent);
  }

  button {
    width: 100%; height: 2.25rem; padding: 0.5rem 1rem;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--primary); color: var(--primary-foreground);
    font: inherit; font-size: 0.875rem; font-weight: 500;
    border: 0; border-radius: calc(var(--radius) - 2px); outline: none; cursor: pointer;
    box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    transition: background-color 150ms, box-shadow 150ms;
  }
  button:hover { background: color-mix(in oklch, var(--primary) 90%, transparent); }
  button:focus-visible { box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring) 50%, transparent); }
</style>
</head>
<body>
  <form class="card" method="post" action="$action">
    <div class="card-header">
      <h1 class="card-title">$title</h1>
    </div>
    <div class="card-content">
      <div class="alert" role="alert"$error_hidden>$error_message</div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Sign in</button>
    </div>
  </form>
</body>
</html>
