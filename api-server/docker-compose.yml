services:
  gateway:
    build: ./services/api_gateway
    container_name: gateway
    ports:
      - "80:80"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
    depends_on:
      auth-service:
        condition: service_healthy
      competition-service:
        condition: service_healthy
    networks:
      - public
      - internal

  migrate:
    build:
      context: .
      dockerfile: migrations/Dockerfile
    container_name: migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    networks:
      - internal

  competition-service:
    build:
      context: .
      dockerfile: services/competition_service/Dockerfile
    container_name: competition-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PROJECT_NAME: competition-service
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DOCS_ENABLED: ${DOCS_ENABLED}
      DOCS_USERNAME: ${DOCS_USERNAME}
      DOCS_PASSWORD: ${DOCS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')",
        ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  auth-service:
    build:
      context: .
      dockerfile: services/auth_service/Dockerfile
    container_name: auth-service
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PROJECT_NAME: auth-service
      SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DOCS_ENABLED: ${DOCS_ENABLED}
      DOCS_USERNAME: ${DOCS_USERNAME}
      DOCS_PASSWORD: ${DOCS_PASSWORD}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')",
        ]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  db:
    image: postgres:18-alpine
    container_name: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

volumes:
  db_data:

networks:
  public:
  internal:
    internal: true
